<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>てのひなタンコ</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e6e1d6;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none;font:13px/1.4 system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;color:#33302a}
#top{display:flex;align-items:center;gap:8px}
#top .bar{flex:1;height:6px;background:rgba(0,0,0,.12);border-radius:3px;overflow:hidden}
#top .bar i{display:block;height:100%;width:0;background:#6a6256}
#stats{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;max-width:260px}
#stats .bar{height:6px;background:rgba(0,0,0,.12);border-radius:3px;overflow:hidden}
#stats .bar i{display:block;height:100%;width:0;background:#6a6256}
#bgmbtn{pointer-events:auto;padding:4px 8px;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.75);color:#33302a;border-radius:8px;font:12px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;white-space:nowrap}
#dogbtn{pointer-events:auto;padding:4px 10px;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.75);color:#33302a;border-radius:8px;font:11.5px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#kennel,#shop,#login{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,320px);padding:14px;background:rgba(250,247,240,.96);border:1px solid rgba(0,0,0,.18);border-radius:12px;display:none;font:14px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;color:#33302a;touch-action:manipulation}
#kennel.open,#shop.open,#login.open{display:block;max-height:80vh;overflow-y:auto}
#kennel .row,#shop .row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
#kennel .row,#shop .row button{flex:0 0 4.6em;padding:10px 0;border:1px solid rgba(0,0,0,.18);background:#fff;color:#33302a;border-radius:8px;font:13px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif}
#kennel .row,#shop .row button.on{background:#4a443a;color:#fff;border-color:#4a443a}
#kennel .row,#shop .row input{flex:1;min-width:0;padding:9px 8px;border:1px solid rgba(0,0,0,.25);border-radius:8px;font:16px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;background:#fff;color:#33302a}
#kennel .pclose,#shop .pclose,#login .pclose{width:100%;padding:10px 0;border:1px solid rgba(0,0,0,.18);background:#fff;color:#33302a;border-radius:8px;font:13px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);padding:8px 14px;background:rgba(40,36,30,.82);color:#fff;border-radius:8px;font:14px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:center;padding:10px 8px calc(env(safe-area-inset-bottom) + 12px)}
#dock button{flex:1;min-width:0;max-width:80px;padding:12px 0;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.75);color:#33302a;border-radius:8px;font:12.5px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif}
#dock button.on{background:#4a443a;color:#fff;border-color:#4a443a}
#tricks{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);display:none;gap:6px;overflow-x:auto;padding:0 8px 6px}
#tricks.open{display:flex}
#tricks button{flex:0 0 auto;padding:10px 14px;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.85);color:#33302a;border-radius:8px;font:13px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif}
#login .sec{margin:0 0 10px;font-weight:600;text-align:center}
#logincells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
#login .lc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:1px solid rgba(0,0,0,.18);border-radius:8px;background:#fff;font-size:11px}
#login .lc b{font-size:15px}
#login .lc em{font-style:normal;font-size:10px}
#login .lc.done{opacity:.45}
#login .lc.today{background:#4a443a;color:#fff;border-color:#4a443a}
#shop .sec{margin:4px 0 8px;font-weight:600}
#shop .srow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
#shop .srow .nm{flex:1;min-width:0}
#shop .srow button{flex:0 0 auto;padding:9px 10px;border:1px solid rgba(0,0,0,.18);background:#fff;color:#33302a;border-radius:8px;font:13px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif}
#shop .pclose{margin-top:6px}
#kennel .lock,#shop .have{opacity:.55}
#kennel button:disabled,#kennel input:disabled,#shop button:disabled{opacity:.4}
#shopbtn{pointer-events:auto;padding:4px 8px;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.75);color:#33302a;border-radius:8px;font:12px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;white-space:nowrap}
#endbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);display:none;padding:12px 26px;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.92);color:#33302a;border-radius:10px;font:14px system-ui,'Hiragino Sans','Noto Sans JP',sans-serif}
#endbtn.show{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div id="top"><button id="dogbtn" type="button">赤柴</button><span id="lv">Lv.1</span><div class="bar"><i id="xp"></i></div><span>コイン <b id="coin">0</b></span><button id="shopbtn" type="button">ショップ</button><button id="bgmbtn" type="button">BGM:入</button></div>
 <div id="stats">
  <span>満腹</span><div class="bar"><i id="b-satiety"></i></div>
  <span>水分</span><div class="bar"><i id="b-water"></i></div>
  <span>清潔</span><div class="bar"><i id="b-clean"></i></div>
  <span>なかよし</span><div class="bar"><i id="b-love"></i></div>
 </div>
</div>
<div id="toast"></div>
<div id="kennel">
 <div id="krows"></div>
 <button id="kclose" class="pclose" type="button">とじる</button>
</div>
<div id="shop">
 <div class="sec">コイン <b id="shopcoin">0</b></div>
 <div id="shopbody"></div>
 <button id="sclose" class="pclose" type="button">とじる</button>
</div>
<div id="login">
 <div class="sec" id="loginmsg"></div>
 <div id="logincells"></div>
 <button id="loginok" class="pclose" type="button">うけとる</button>
</div>
<button id="endbtn" type="button">おわる</button>
<div id="tricks">
 <button data-trick="sit">おすわり</button>
 <button data-trick="down">ふせ</button>
 <button data-trick="dead">しんだふり</button>
 <button data-trick="roll">ごろん</button>
 <button data-trick="spin">くるっ</button>
 <button data-trick="beg">ちんちん</button>
</div>
<div id="dock">
 <button data-act="pet">なでる</button>
 <button data-act="eat">ごはん</button>
 <button data-act="drink">みず</button>
 <button data-act="bath">おふろ</button>
 <button data-act="ball">ボール</button>
 <button data-act="walk">さんぽ</button>
 <button data-act="hold">だっこ</button>
 <button data-act="trick">げい</button>
</div>
